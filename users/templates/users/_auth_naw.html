<ul class="navbar-nav ms-auto">
  {% if request.user.is_authenticated %}
    <li class="nav-item"><a class="nav-link" href="{% url 'users:profile' %}">Профиль</a></li>
    <li class="nav-item">
      <form action="{% url 'users:logout' %}" method="post" class="d-inline">
        {% csrf_token %}
        <button type="submit" class="btn btn-link nav-link p-0 m-0 align-baseline">Выход</button>
      </form>
    </li>
  {% else %}
    <li class="nav-item"><a class="nav-link" href="{% url 'users:login' %}">Вход</a></li>
    <li class="nav-item"><a class="nav-link" href="{% url 'users:register' %}">Регистрация</a></li>
  {% endif %}
</ul>
