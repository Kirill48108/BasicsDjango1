{% load static %}
{% load my_tags %}
<div class="col">
  <div class="card shadow-sm h-100 position-relative">
    <div class="position-absolute top-0 end-0 m-2">
      <span class="badge bg-secondary opacity-75"></span>
    </div>

    {% with img_url=product.pic|media_filter %}
      {% if img_url %}
        <img src="{{ img_url }}" class="bd-placeholder-img card-img-top" alt="{{ product.name }}">
      {% else %}
        <img src="{% static 'img/placeholder.png' %}" class="bd-placeholder-img card-img-top" alt="Нет изображения">
      {% endif %}
    {% endwith %}

    <div class="card-body d-flex flex-column">
      <h5 class="card-title">{{ product.name }}</h5>
      <p class="card-text">{{ product.description|truncatechars:120 }}</p>
      <div class="mt-auto d-flex justify-content-between align-items-center">
        <div class="d-flex gap-2">
          <a href="{% url 'catalog:product_detail' product.pk %}" class="btn btn-sm btn-outline-primary">Подробнее</a>
          {% if request.user.is_authenticated %}
            <a href="{% url 'catalog:product_update' product.pk %}" class="btn btn-sm btn-outline-warning">Изменить</a>
            <a href="{% url 'catalog:product_delete' product.pk %}" class="btn btn-sm btn-outline-danger">Удалить</a>
          {% endif %}
        </div>
        <small class="text-body-secondary">{{ product.price }} ₽</small>
      </div>
    </div>
  </div>
</div>
